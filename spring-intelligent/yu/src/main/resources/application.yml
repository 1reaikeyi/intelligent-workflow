# 服务端口与应用名
server:
  port: 8080

spring:
  ai:
    dashscope:
      base-url: https://dashscope.aliyuncs.com
      api-key: ${PATH_ai_aliyun_api}
      audio:
        speech:
          options:
            model: sambert-zhiqi-v1
            format: mp3
            speed: 0.8
            volume: 60
        transcription:
          options:
            model: paraformer-v2
