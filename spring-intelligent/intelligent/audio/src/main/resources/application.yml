# Spring配置
server:
  port: 8080

spring:
  ai:
    dashscope:
      base-url: https://dashscope.aliyuncs.com
      api-key: ${PATH_ai_aliyun_api}
      chat:
        # 文本生成
        # completions-path:/api/v1/services/aigc/text-generation/generation
        # 多模态生成
        # completions-path: /api/v1/services/aigc/multimodal-generation/generation
        completions-path: /api/v1/services/aigc/multimodal-generation/generation
        options:
          model: qwen3.8-flash
          max-tokens: 1024        # 限制输出，避免无限思考
          enable-thinking: false  # 识图场景一般不需要思考链
#      embedding:
        # 文本向量
#        embeddings-path: /api/v1/services/embeddings/text-embedding/text-embedding
        # 图片向量
#        multimodal:
#          multimodal-path: /api/v1/services/embeddings/multimodal-embedding/multimodal-embedding
#        options:
#          model: text-embedding-v3
        
       

  application:
    name: qwen
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB
  config:
    import: classpath:mysql.yaml,classpath:mysql-dev.yaml

# 图片上传限制
image:
  max-width: 2048
  max-height: 2048



