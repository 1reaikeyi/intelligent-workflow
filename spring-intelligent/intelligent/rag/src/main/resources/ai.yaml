# chat model
spring:
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${PATH_ai_aliyun_api}
      chat:
        options:
          model: qwen3.8-flash
      embedding:
        options:
          model: qwen3.7-text-embedding
          dimensions: 1024
          encoding-format: float
    vectorstore:
      redis:
        initialize-schema: true
        index-name: spring-ai-index
        prefix: "embedding"
  config:
    import: classpath:session.yml
tj:
  ai:
    #系统提示词
    prompt:
      system:
        chat:
          # 系统提示词文件路径，用于定义AI助手的角色和技能
          file: classpath:file/system-message.txt
          group: DEFAULT_GROUP
          timeout-ms: 20000
        route-agent:
          # 路由代理系统消息文件路径，用于意图识别
          file: classpath:file/route-agent-system-message.txt
        recommend-agent:
          # 推荐智能体系统消息文件路径，用于课程推荐
          file: classpath:file/recommend-agent-system-message.txt
        knowledge-agent:
          # 知识讲解智能体系统消息文件路径
          file: classpath:file/knowledge-agent-system-message.txt
    #memory
    memory:
      #存储最大的聊天记录数
      maxMessage: 20
      type: redis