# Spring配置
spring.application.name=qwen
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.ai.openai.base-url=https://api-inference.modelscope.cn
spring.ai.openai.api-key=${PATH_ai_qwen_api}
spring.ai.openai.chat.options.model=Qwen/Qwen3.5-27B
spring.ai.openai.chat.completions-path=/v1/chat/completions

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/use_take_out
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

# 图片上传限制
image.max-width=2048
image.max-height=2048

# 日志配置
logging.charset.console=UTF-8
logging.level.org.springframework.ai=debug
logging.level.org.springframework.web.client=debug